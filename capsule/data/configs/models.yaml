# Model registry — P4
#
# One entry per model version. `pilot: true` = in the cheap pilot set (mini/flash
# tier only). Flagship models are `pilot: false` and reserved for the FULL run.
#
# Snapshot strings are PROVISIONAL and must be confirmed by capture/probe.py,
# which writes the served-model fingerprint + measured per-call price into
# manifest/probe_receipts.json before any real run. If a snapshot 404s, swap to
# the current mini/flash snapshot and log a DECISIONS.md entry. The analysis is
# agnostic to the exact snapshot (provenance is recorded per row).
#
# price_in / price_out are USD per 1,000,000 tokens. They are used by the ledger
# to price every call and enforce the hard spend cap. Where a live price is
# unknown, values are set CONSERVATIVELY (round up) so the cap bites early rather
# than late. probe.py overwrites price_in/out with measured values when available.

models:

  # ── OpenAI family (within-family pair #1) ── PILOT ─────────────────────────
  openai_4o_mini:
    family: openai
    provider: openai
    key_env: OPENAI_API_KEY          # secrets.py treats *_1/_2/_3 as a pool
    base_url: null                   # default OpenAI endpoint
    api_model: gpt-4o-mini-2024-07-18
    price_in: 0.15
    price_out: 0.60
    max_tokens: 128
    pilot: true
    extra: {}
    probe_receipt: null              # filled by probe.py

  openai_41_mini:
    family: openai
    provider: openai
    key_env: OPENAI_API_KEY
    base_url: null
    api_model: gpt-4.1-mini-2025-04-14
    price_in: 0.40
    price_out: 1.60
    max_tokens: 128
    pilot: true
    extra: {}
    probe_receipt: null

  # ── Google Gemini family (within-family pair #2) ── PILOT ──────────────────
  # Gemini 2.0 Flash / Flash-Lite snapshots were SHUT DOWN 2026-06-01 (DECISIONS D13).
  # Current flash tier: Gemini 3.5 Flash (gemini-flash-latest) + Gemini 2.5 Flash-Lite
  # (gemini-flash-lite-latest). Using -latest aliases (they resolve to the current
  # stable release); probe.py pins the served-model fingerprint for provenance.
  # Prices set conservatively; probe.py overwrites with the measured per-call cost.
  gemini_flash:
    family: google
    provider: gemini
    key_env: GEMINI_API_KEY
    base_url: null                   # native google-genai client
    api_model: gemini-flash-latest   # -> Gemini 3.5 Flash
    price_in: 0.50
    price_out: 3.00
    max_tokens: 128
    thinking_budget: 0               # disable thinking (Flash supports it; keeps it cheap)
    pilot: true
    extra: {}
    probe_receipt: null

  gemini_flash_lite:
    family: google
    provider: gemini
    key_env: GEMINI_API_KEY
    base_url: null
    api_model: gemini-flash-lite-latest   # -> Gemini 2.5 Flash-Lite
    price_in: 0.15
    price_out: 0.60
    max_tokens: 128
    thinking_budget: 0               # disable thinking (keeps it cheap)
    pilot: true
    extra: {}
    probe_receipt: null

  # ── FULL-RUN ONLY (flagship / larger variants) ── NOT in pilot ─────────────
  openai_4o:
    family: openai
    provider: openai
    key_env: OPENAI_API_KEY
    base_url: null
    api_model: gpt-4o-2024-11-20
    price_in: 2.50
    price_out: 10.00
    max_tokens: 128
    pilot: false
    extra: {}
    probe_receipt: null

  gemini_pro:
    family: google
    provider: gemini
    key_env: GEMINI_API_KEY
    base_url: null
    api_model: gemini-pro-latest       # -> current Gemini Pro (3.1-pro line, 2026)
    price_in: 1.25
    price_out: 10.00
    max_tokens: 128
    pilot: false
    extra: {}
    probe_receipt: null

  # xAI Grok 4.5 — the FULL-RUN third family / cost driver (DECISIONS D11-D12).
  # grok-3 / grok-3-mini were retired 2026-05-15; grok-4.5 ($2/$6 per 1M, per
  # docs.x.ai 2026-07-09) is the current general text model. Priced CONSERVATIVELY
  # ($2.5/$7) so the $200 full cap bites early; probe.py overwrites with the measured
  # price. reasoning_effort=low + larger max_tokens so default reasoning does not eat
  # the output budget and return empty content.
  xai_grok:
    family: xai
    provider: xai
    key_env: XAI_API_KEY
    base_url: https://api.x.ai/v1
    api_model: grok-4.5
    price_in: 2.50
    price_out: 7.00
    max_tokens: 256
    reasoning_effort: low
    pilot: false
    extra: {}
    probe_receipt: null
