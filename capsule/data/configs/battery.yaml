# Battery spec — P4
#
# Deterministic, offline, $0. build_battery.py mints a synthetic FATF/SAML-D/
# AMLSim-anchored typology battery and SHA-256 freezes it. The full battery is
# minted once; the pilot battery is a strict seeded stratified SUBSAMPLE of it
# (pilot ⊂ full; per-case ids and content are identical).
#
# DUAL-USE: difficulty is a fixed design knob derived from FATF typology salience.
# No arm tunes cases against model outputs. Synthetic only; not an evasion recipe.

seed: 20260715          # SAMPLING_SEED: generation + stratified subsampling

sizes:
  full: 600             # whole battery (pre-registered ~500-800; fixed at 600)
  pilot: 240            # stratified subsample of the full battery

class_balance:
  suspicious: 0.5
  benign: 0.5

difficulty_mix:         # applied within each class
  easy: 0.30
  medium: 0.40
  hard: 0.30

# Suspicious typologies (FATF catalogue + SAML-D / AMLSim lineages).
suspicious_typologies:
  - structuring          # smurfing: sub-threshold deposits to dodge CTR/SAR
  - layering             # rapid multi-hop transfers to obscure origin
  - trade_based          # over/under-invoicing, phantom shipments
  - mule_network         # many low-value accounts converging to one beneficiary
  - shell_layering       # transfers through shell entities with no economic substance
  - funnel_account       # deposits in many geographies, withdrawals in one
  - rapid_passthrough    # money in and out within hours, ~zero balance retained
  - cash_intensive_front # legitimate-looking cash business masking placement

# Benign patterns are HARD NEGATIVES: legitimate behaviours that superficially
# resemble an alerting condition, so "flag everything" does not trivially pass.
benign_patterns:
  - payroll_fanout           # employer → many employees on a schedule
  - treasury_sweep           # intra-group cash concentration / zero-balancing
  - genuine_trade_finance    # documented LC-backed cross-border trade
  - retail_settlement        # high-volume card/merchant settlement
  - marketplace_payouts      # platform → many sellers
  - loan_disbursement        # lender → borrower → vendor chain
  - remittance_corridor      # licensed MTO family remittances
  - subscription_billing     # many small recurring inbound payments

# Serialization: fixed plain-text node/edge schema following the graph-
# serialization convention of arXiv 2507.14785 (cited precedent). Emitted by
# build_battery.py; see that file for the exact template.
serialization:
  version: 2                      # Amendment 1 (2026-07-16): H1-H4 hardening
  precedent: "arXiv:2507.14785"
  format: "raw nodes+edges plain text; NO natural-language summary line (H1)"
  currency: USD
  reporting_threshold: 10000     # CTR threshold; structuring uses IRREGULAR sub-threshold amounts (H2)
  hardening: "H1 raw logs only; H2 irregular sub-threshold amounts; H3 signal interleaved with benign background volume; H4 realistic temporal dispersion. See PREREGISTRATION_AMENDMENT.md."
