# Grid & run config — P4
#
# The capture grid is K models × seeds × prompt variants over a battery subgrid.
# Pilot vs full subgrids select which models, how many seeds, and which battery.

seed_master: 20260715      # feeds the per-cell parity seed (with case+variant+idx)
analysis_seed: 4242        # ANALYSIS_SEED: bootstrap

# ── Budgets (USD) ──────────────────────────────────────────────────────────
budgets:
  pilot: 10.00             # BUDGET_PILOT — HARD. Ledger aborts > this. Preflight
                           # refuses to start if projected pilot cost > this.
  full: 25.00              # BUDGET_FULL — HARD ceiling for the trimmed confirmatory
                           # run (~$19 realistic, worst-case ~$21). See DECISIONS D16.
stop_margin_usd: 0.05      # stop this far below the cap (headroom for in-flight)

# ── Concurrency / rate / retries ───────────────────────────────────────────
max_workers: 5             # MAX_WORKERS (tier-1 TPM safe)
max_retries: 10            # MAX_RETRIES; honor Retry-After
judge_temperature: 0.0     # JUDGE_TEMPERATURE
rpm_limits:                # per-provider requests/min (0 = unthrottled)
  openai: 450
  gemini: 300
  xai: 60
daily_limits: {}           # per-model/day caps (circuit-breaker); empty = none

# ── Prompt variants (both supervisory; forbid free text outside JSON) ──────
prompt_variants:
  - v_terse                # compliance-officer one-liner + JSON schema (pilot)
  - v_fatf                 # short FATF-typology-aware instruction + JSON schema (pilot)
  - v_riskbased            # risk-based-approach framing + JSON schema (full run only)

# ── Subgrids ───────────────────────────────────────────────────────────────
subgrids:
  pilot:
    # Original cheap-only design (Gemini billing restored, DECISIONS D12): two
    # within-family pairs (OpenAI mini pair + Gemini flash pair) → within- vs
    # cross-family contrast. Flagships (grok, large GPT) stay full-run only.
    models: [openai_4o_mini, openai_41_mini, gemini_flash, gemini_flash_lite]
    variants: [v_terse, v_fatf]
    seed_indices: [0, 1]
    battery: pilot         # the 240-case stratified subsample
  full:
    # Trimmed confirmatory grid (DECISIONS D16): keep full MODEL BREADTH (7 models,
    # mini->flagship, 3 families) — that breadth IS the headline (model choice drives
    # FP burden) and exceeds the published AML-LLM norm (median 1-4 models). Economize
    # on robustness dimensions: 2 variants x 2 seeds. Realistic ~$19, cap $25.
    # gemini_pro dropped (D17: forced-thinking, cost/latency-unsuited). xai_grok
    # dropped (D19: xAI account out of credits). Final grid = 5 models across 2
    # families (OpenAI x3, Google x2) — still above the AML-LLM norm; the FP-variance
    # headline is already large within these (pilot: 0%->80%). grok stays in the
    # registry for an optional later one-model top-up if a reviewer asks.
    models: [openai_4o_mini, openai_41_mini, gemini_flash, gemini_flash_lite, openai_4o]
    variants: [v_terse, v_fatf]
    seed_indices: [0, 1]
    battery: full          # the whole 600-case battery (300 benign -> tight FP CIs)

# Guard: the pilot subgrid may reference ONLY models with pilot: true. loader.py
# enforces this so a flagship can never sneak into a ≤$10 pilot.
pilot_requires_cheap: true
