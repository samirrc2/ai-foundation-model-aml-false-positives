metadata_version: 1
name: "AI foundation model choice and false positive variation in Anti Money Laundering transaction screening"
description: >
  Reproducibility capsule for the Discover Artificial Intelligence manuscript "AI
  foundation model choice and false positive variation in Anti Money Laundering
  transaction screening." From the frozen 12,000-call
  capture over five foundation LLMs on a FATF/SAML-D-anchored 600-case battery, it
  regenerates and verifies the battery (SHA-256), then reproduces every headline
  number: per-model false-positive rates with Wilson and cluster-bootstrap
  confidence intervals, the 82.7-point false-positive spread and 85.7% cross-model
  disagreement, the paired inferential tests (Cochran's Q, McNemar exact with
  Bonferroni correction), per-model classification metrics, the rules and supervised
  baselines, the operational alert-volume projection, the trade-based blind spot,
  and prompt-robustness — plus a byte-identical reproducibility check. Keys-free
  Reproducible Run via /code/run. Code Ocean DOI: https://doi.org/10.24433/CO.4804007
  (this build supersedes v1).
