# topics/P4.yaml
# killshot topic definition — Paper 5 ("One Screener to Miss Them All", AML monoculture)
# Frozen input to the kill-shot + feasibility sweep. Do not edit after a sweep is run.

topic_id: P4
title: "One Screener to Miss Them All"

claim: >
  First measurement of whether LLM AML-screening misses are CORRELATED across
  foundation models / institutions, and whether "defense in depth" (a
  heterogeneous second screening line) survives foundation-model monoculture:
  joint-miss probability vs an independence benchmark on a FATF/SAML-D-anchored
  typology battery, across K models x seeds x prompt variants.

framework_cell: "B9 (systemic risk / correlated failure — measured)"

seed_queries:
  - "LLM AML screening correlated misses across models monoculture"
  - "foundation model monoculture correlated errors transaction monitoring systemic risk"
  - "joint miss probability independence benchmark LLM screening"
  - "defense in depth heterogeneous second line LLM AML survives monoculture"
  - "cross-model error correlation LLM hiring judge resume screening"
  - "algorithmic monoculture correlated rejection failure PNAS"
  - "homogenization outcomes systemic failure ratio foundation models Bommasani"
  - "LLM fraud detection ensemble diversity correlated false negatives"
  - "sanctions screening name matching LLM reliability variance"
  - "in-context learning money laundering detection financial graphs"
  - "SAML-D AMLSim synthetic typology battery money laundering"
  - "third-party concentration cloud monoculture AI banking supervisory warning"

kill_rules:
  - "kill if: cross-MODEL (not just cross-seed) error-correlation measurement
     + LLM/foundation-model rater + AML/sanctions/transaction-screening task
     + joint-miss vs independence benchmark quantified. ALL four conjuncts
     required for DIRECT_HIT."

# Prior work we EXPECT to exist and cite. Finding these is healthy, not fatal.
foundation_expected:
  - "Kleinberg & Raghavan PNAS 2021 (monoculture -> correlated failure; supplies the mechanism)"
  - "Bommasani et al. NeurIPS 2022 (homogenization metrics: systemic-failure ratio vs independence)"
  - "In-Context Learning for Money Laundering Detection in Financial Graphs (arXiv 2507.14785; graph-serialization precedent)"
  - "SAML-D / IBM AMLSim (typology batteries, synthetic laundering data)"
  - "FATF published typology catalogue (battery provenance)"

# Known adjacent work already de-conflicted. Not a kill.
adjacent_known:
  - "Correlated Errors in Large Language Models (arXiv 2506.07962, ICML'25) — SAME formalism
     (cross-model error correlation, 350+ models) but hiring + LLM-judge domains, NOT AML: TEMPLATE, not a kill."
  - "Algorithmic Monocultures in Hiring (arXiv 2605.27371, Bommasani et al.) — monoculture homogeneity of
     rejections, hiring domain, real applicant data: TEMPLATE, different domain."
  - "Representation Homogeneity & Systemic Instability in AI-dominated markets (arXiv 2604.22818) — markets, not screening misses."
  - "The Oracle's Fingerprint: Correlated AI Forecasting Errors (arXiv 2605.00844) — forecasting, not AML screening."
  - "Tabular CCFD adversarial transferability (arXiv 2508.14699) — gradient/tabular attack surface, classical ML."
  - "Explainable AML Triage with LLMs (arXiv 2604.19755) — AML+LLM but triage/capability (B1/B2), not reliability."

status: drawer
last_sweep: "2026-07-15"

# --- Stage-8 judgment overrides (authoritative; render without DRAFT) ---
lead_finding: >
  Joint-miss probability is X x the independence benchmark; a heterogeneous
  second screening line recovers only Y% of the promised miss reduction.
referee_risk: >
  Low-medium: "synthetic typologies != real laundering" — anchor the battery to
  FATF-published typologies + SAML-D provenance; pre-empt dual-use by supervisory
  framing (measure misses, never optimize evasion).
data_collection: >
  Moderate: typology battery x K models x seeds x prompt variants; battery derivable
  from SAML-D/AMLSim, collect-once, SHA-256'd.
compute_cost: "~P1-pilot scale (<$300 gate); classification-length outputs keep tokens cheap."
regulatory_hook: >
  FinCEN/BSA SAR regime; FATF typologies; AMLA reform discourse; ECB/BIS monoculture +
  third-party-concentration warnings; SR 26-2 GenAI scope gap.
venue: "IEEE Access first shot (Sarna et al. fraud review published there; its Open Issues list has zero reliability/monoculture items = gap confirmed from inside the field); J. Money Laundering Control / FRL fallback."
t2:
  jobs: "Strongest of slate — fraud/AML + AI risk sits on Citibank credit-risk history; authentic."
  publishable: "High."
  citations: "High — fraud detection is citation-heavy; first reliability paper in it; security+compliance+finance audiences."
  eb1a: "Adds the financial-crime pillar; completes the P4+P1+P5 'AI monoculture as systemic risk' triangle."
dependency: "Independent of P1-P3 (methodological continuity only); dual-use discipline is a hard design constraint; supervisory framing keeps it in OBI scope."
sequencing: "Run first — highest scoop pressure + highest job-market signal."

# --- Stage-4.5 FEASIBILITY inputs ---
primary_metric: "joint-miss probability ratio vs independence benchmark (across K foundation models)"
alt_metrics:
  - "defense-in-depth recovery rate: % of promised miss-reduction retained under a heterogeneous 2nd line"
  - "pairwise error correlation (Cohen's kappa) on the typology battery"
  - "systemic-failure ratio (Bommasani) vs the independence null"
signal_if: >
  joint-miss probability significantly exceeds the independence benchmark AND
  heterogeneous second-line recovery is materially < 100%.
# NOTE: the critical cell is the measurable SUBSTRATE the headline stands on
# (LLM AML/sanctions screening being a real, indexed practice), NOT the exact
# contribution cell (which we WANT near-empty for novelty; the study supplies its
# own SAML-D/AMLSim battery, so index-emptiness of the exact cell is not a
# feasibility blocker).
critical_cell_query: '"LLM" ("anti-money laundering" OR "transaction monitoring" OR "sanctions screening")'
min_critical_cell: 25
min_corpus_precision: 0.40
observability_window: [2024, 2026]
